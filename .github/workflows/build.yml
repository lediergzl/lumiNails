name: Build Luni web apps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Test inverse recipe search
        run: npm --workspace @lumi/provider run test:recipes
      - name: Build both apps
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: anon
        run: npm run build

  offline-e2e:
    runs-on: ubuntu-latest
    needs: web-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install root dependencies
        run: npm install
      - name: Build apps for the simulated Supabase environment
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: anon
        run: npm run build
      - name: Install offline E2E dependencies
        working-directory: scripts/e2e-offline
        run: npm install
      - name: Test client offline queue
        run: node scripts/e2e-offline/run.mjs client
      - name: Test provider offline queue
        run: node scripts/e2e-offline/run.mjs provider
